version: "3.9"

networks:
  zone2-net:
    driver: bridge

volumes:
  pgdata:
  redisdata:

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cdp
      POSTGRES_USER: cdp_user
      POSTGRES_PASSWORD: changeme123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks: [zone2-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdp_user -d cdp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server /etc/redis/redis.conf
    volumes:
      - redisdata:/data
      - ./infra/redis/redis.conf:/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks: [zone2-net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Zone 3 Mocks
  # ---------------------------------------------------------------------------
  mock-keycloak:
    build: ./services/mock-keycloak
    environment:
      KC_ISSUER: http://mock-keycloak:8180/realms/hd
      KC_CLIENT_ID: citizen-gw-exchanger
      KC_CLIENT_SECRET: exchanger-secret-xyz
      JWT_TTL: "300"
    ports:
      - "8180:8180"
    networks: [zone2-net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8180/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Keycloak (real) — replaces mock-keycloak as the active OIDC provider.
  # mock-keycloak service block is kept above so the stack can be flipped back
  # by swapping KC_URL / KEYCLOAK_URL and depends_on entries.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.0
    command: ["start-dev", "--import-realm", "--features=token-exchange"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      # Force issuer / discovery URLs to the docker network hostname so
      # the JWT `iss` claim matches what portal-backend / TXS / mock-internal-gw
      # compare it against (they all use http://keycloak:8080/realms/hd).
      KC_HOSTNAME_URL: http://keycloak:8080
      KC_HOSTNAME_ADMIN_URL: http://keycloak:8080
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/hd-realm.json:/opt/keycloak/data/import/hd-realm.json:ro
    ports:
      # Browser access requires the host port to match KC_HOSTNAME_URL's port
      # so login redirects don't break. Add `127.0.0.1 keycloak` to the
      # Windows hosts file to reach the admin console at http://keycloak:8080/.
      - "8080:8080"
    networks: [zone2-net]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/hd/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  mock-internal-gw:
    build: ./services/mock-internal-gw
    environment:
      KC_URL: http://keycloak:8080
      KC_REALM: hd
    ports:
      - "8090:8090"
    networks: [zone2-net]
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Zone 2 Services
  # ---------------------------------------------------------------------------
  token-exchange-service:
    build:
      context: .
      dockerfile: services/token-exchange-service/Dockerfile
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: hd
      EXCHANGER_CLIENT_ID: citizen-gw-exchanger
      EXCHANGER_CLIENT_SECRET: exchanger-secret-xyz
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: changeme123
      JWT_CACHE_TTL: "240"
      JWT_TTL: "300"
      # Only the gateway may ask for an impersonated JWT — without this the
      # exchange endpoint would mint a token for any user on request.
      INTERNAL_API_KEY: internal-shared-key-devonly
    ports:
      - "8081:8081"
    networks: [zone2-net]
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  portal-backend:
    build:
      context: .
      dockerfile: services/portal-backend/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: cdp
      POSTGRES_USER: cdp_user
      POSTGRES_PASSWORD: changeme123
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: changeme123
      SERVER_KEY: 5f3b8a2c1d9e4f7a6b0c5d2e8f1a3b4c
      KC_URL: http://keycloak:8080
      KC_REALM: hd
      KC_CLIENT_ID: citizen-gw-exchanger
      KC_CLIENT_SECRET: exchanger-secret-xyz
      # Catalog registration -> APISIX Admin API auto route provisioning
      # (spec section 8). citizen-gateway is intentionally NOT a depends_on
      # here — that would create a startup cycle (citizen-gateway already
      # depends on portal-backend). apisix_client retries instead.
      APISIX_ADMIN_URL: http://citizen-gateway:9180
      APISIX_ADMIN_KEY: edd1c9f034335f136f87ad84b625c8f1
      GATEWAY_URL: http://citizen-gateway:9080
      TXS_URL: http://token-exchange-service:8081
      PORTAL_BACKEND_INTERNAL_URL: http://portal-backend:8080
      # Guards /internal/* (PAT metadata + audit ingest) against anyone on the
      # network. Pushed into the gateway plugin config by apisix_client.
      INTERNAL_API_KEY: internal-shared-key-devonly
      # Mock SSO for the local stack only — must be false anywhere real.
      ENABLE_DEV_AUTH: "true"
    ports:
      # Moved off host port 8080 so keycloak can take it — that lets the
      # Windows browser (with `127.0.0.1 keycloak` in its hosts file) reach
      # Keycloak at the same `http://keycloak:8080` URL that internal services
      # use, keeping the JWT `iss` claim consistent.
      - "8082:8080"
    networks: [zone2-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  etcd:
    image: bitnamilegacy/etcd:latest
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    networks: [zone2-net]
    healthcheck:
      test: ["CMD-SHELL", "etcdctl endpoint health"]
      interval: 5s
      timeout: 5s
      retries: 10

  citizen-gateway:
    image: apache/apisix:3.9.1-debian
    volumes:
      - ./services/apisix-gateway/conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./services/apisix-gateway/plugins:/usr/local/apisix-custom:ro
      - ./infra/redis/quota_deduct.lua:/opt/redis-scripts/quota_deduct.lua:ro
    ports:
      - "9080:9080"
      - "9091:9091"
      - "9180:9180"
    networks: [zone2-net]
    depends_on:
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      portal-backend:
        condition: service_started
      token-exchange-service:
        condition: service_started
      mock-internal-gw:
        condition: service_started

  portal-web:
    build: ./frontend/portal-web
    ports:
      - "3000:80"
    networks: [zone2-net]
    depends_on:
      - portal-backend
      - citizen-gateway

  # ---------------------------------------------------------------------------
  # Observability (minimal)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks: [zone2-net]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    networks: [zone2-net]
    depends_on:
      - prometheus
