openapi: 3.0.3
info:
  title: HR 직원 API
  description: |
    인사 직원 정보 조회 API (api_code: `HR-EMPLOYEE`, 제한적 공개).
    Citizen Developer API 포털에서 발급받은 PAT(Personal Access Token)를
    `Authorization: Bearer hdpat_<tokenId>_<secret>` 헤더로 전달해 호출합니다.

    게이트웨이(pat-auth)의 `capi.hr.read` 스코프 검사를 통과한 뒤에도,
    업스트림(mock-internal-gw)이 JWT 클레임의 `scope`/`realm_access.roles`에
    `capi.hr.read` 또는 `hr-reader`가 있는지 한 번 더 자체 검사합니다
    (이중 게이트 — HR 데이터라 스코프 검증이 이원화되어 있습니다).
  version: "1.0.0"
  contact:
    name: HR팀
servers:
  - url: http://localhost:9080
    description: Citizen API Portal Gateway (APISIX, local dev)
tags:
  - name: employees
    description: 직원(Employee) 조회
security:
  - PatAuth: []
paths:
  /capi/v1/employees:
    get:
      operationId: listEmployees
      summary: 직원 목록 조회
      tags: [employees]
      x-required-scope: capi.hr.read
      responses:
        "200":
          description: 직원 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Employee" }
                  total: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            게이트웨이 단계(CDP-1003, problem+json)에서 막히거나, 업스트림의
            자체 스코프 재검사에서 막히는 경우(평문 JSON, CDP-1005) 둘 다 가능.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
            application/json:
              schema: { $ref: "#/components/schemas/UpstreamScopeDenied" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
components:
  securitySchemes:
    PatAuth:
      type: http
      scheme: bearer
      bearerFormat: "hdpat_<tokenId:12>_<secret:43>"
      description: 포털에서 발급한 PAT. 오퍼레이션별 x-required-scope에 해당하는 스코프가 승인되어 있어야 합니다.
  schemas:
    Employee:
      type: object
      properties:
        id: { type: string, example: e001 }
        name: { type: string, example: "김철수" }
        dept: { type: string, example: "IT기획팀" }
        position: { type: string, example: "팀장" }
    UpstreamScopeDenied:
      type: object
      properties:
        code: { type: string, example: "CDP-1005" }
        message: { type: string, example: "Insufficient scope for HR data" }
    Problem:
      type: object
      description: RFC 9457 problem+json — 게이트웨이(pat-auth/pat-quota)가 발생시키는 에러 포맷.
      properties:
        type: { type: string, example: "https://cdp-portal.hd.com/errors/CDP-1003" }
        title: { type: string, example: "Required scope not granted" }
        status: { type: integer, example: 403 }
        code: { type: string, example: "CDP-1003" }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
  responses:
    Unauthorized:
      description: PAT 누락/무효/만료 (CDP-1001/1002) 또는 인가 서비스 장애 (CDP-2001)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    QuotaExceeded:
      description: 호출 쿼터/레이트 초과 (CDP-1004)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
