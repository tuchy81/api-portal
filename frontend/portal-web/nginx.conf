server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without this, nginx resolves upstream hostnames
    # once at config load: it refuses to start if a backend isn't up yet, and
    # it keeps using a stale IP after a backend container is recreated. Using
    # a variable in proxy_pass defers resolution to request time instead.
    # Note: a variable proxy_pass does not append the location URI, so
    # $request_uri (path + query) has to be passed explicitly.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /portal/ {
        set $portal_backend http://portal-backend:8080;
        proxy_pass $portal_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /capi/ {
        set $citizen_gateway http://citizen-gateway:9080;
        proxy_pass $citizen_gateway$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
