openapi: 3.0.3
info:
  title: 수주 현황 API
  description: |
    영업/수주 현황 조회 API (api_code: `FIN-ORDER`).
    Citizen Developer API 포털에서 발급받은 PAT(Personal Access Token)를
    `Authorization: Bearer hdpat_<tokenId>_<secret>` 헤더로 전달해 호출합니다.
  version: "1.0.0"
  contact:
    name: 영업관리팀
servers:
  - url: http://localhost:9080
    description: Citizen API Portal Gateway (APISIX, local dev)
tags:
  - name: orders
    description: 수주(Order) 조회
security:
  - PatAuth: []
paths:
  /capi/v1/orders:
    get:
      operationId: listOrders
      summary: 수주 목록 조회
      tags: [orders]
      x-required-scope: capi.order.read
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1, minimum: 1 }
        - name: size
          in: query
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: 수주 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Order" }
                  total: { type: integer }
                  page: { type: integer }
                  size: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
  /capi/v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: 수주 단건 조회
      tags: [orders]
      x-required-scope: capi.order.read
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
          example: o001
      responses:
        "200":
          description: 수주 상세
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: 존재하지 않는 수주 ID (업스트림이 그대로 반환)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UpstreamNotFound" }
        "429": { $ref: "#/components/responses/QuotaExceeded" }
components:
  securitySchemes:
    PatAuth:
      type: http
      scheme: bearer
      bearerFormat: "hdpat_<tokenId:12>_<secret:43>"
      description: 포털에서 발급한 PAT. 오퍼레이션별 x-required-scope에 해당하는 스코프가 승인되어 있어야 합니다.
  schemas:
    Order:
      type: object
      properties:
        id: { type: string, example: o001 }
        vendor_id: { type: string, example: v001 }
        amount: { type: integer, example: 15000000 }
        status: { type: string, enum: [PENDING, CONFIRMED] }
        date: { type: string, format: date, example: "2026-09-01" }
    UpstreamNotFound:
      type: object
      properties:
        detail:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string, example: "Order o999 not found" }
    Problem:
      type: object
      description: RFC 9457 problem+json — 게이트웨이(pat-auth/pat-quota)가 발생시키는 에러 포맷.
      properties:
        type: { type: string, example: "https://cdp-portal.hd.com/errors/CDP-1003" }
        title: { type: string, example: "Required scope not granted" }
        status: { type: integer, example: 403 }
        code: { type: string, example: "CDP-1003" }
        detail: { type: string }
        instance: { type: string }
        traceId: { type: string }
  responses:
    Unauthorized:
      description: PAT 누락/무효/만료 (CDP-1001/1002) 또는 인가 서비스 장애 (CDP-2001)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    QuotaExceeded:
      description: 호출 쿼터/레이트 초과 (CDP-1004)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
